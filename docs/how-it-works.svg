<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="How Pulsar Sentinel works">
  <title>PULSAR SENTINEL — how the guard works</title>
  <desc>Cluster agents check in with SENTINEL_KEY. Fail closed. Hybrid ML-KEM + AES-256-GCM. ASR batches get a Merkle proof. PTS tiers Safe / Caution / Critical.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#ff00ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="540" fill="#0a0a0f"/>
  <rect x="1" y="1" width="958" height="538" fill="none" stroke="#1a1a25"/>

  <text x="28" y="32" fill="#00f0ff" font-family="ui-monospace, Consolas, monospace" font-size="12" letter-spacing="3">THEBARDCHAT / PULSAR_SENTINEL</text>
  <text x="28" y="62" fill="#e0e0f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700">How the guard works</text>
  <text x="28" y="86" fill="#a0a0b0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Fail closed · ML-KEM + AES-256-GCM · ASR Merkle proofs · live PTS</text>
  <text x="932" y="32" text-anchor="end" fill="#ffd700" font-family="ui-monospace, Consolas, monospace" font-size="11">PORT 8250</text>

  <!-- CORE -->
  <circle cx="480" cy="175" r="44" fill="none" stroke="url(#g)" stroke-width="3" filter="url(#glow)">
    <animate attributeName="r" values="42;48;42" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="175" r="28" fill="#101018" stroke="#00f0ff" stroke-width="2"/>
  <text x="480" y="172" text-anchor="middle" fill="#00f0ff" font-family="ui-monospace, Consolas, monospace" font-size="11">CORE</text>
  <text x="480" y="186" text-anchor="middle" fill="#a0a0b0" font-family="ui-monospace, Consolas, monospace" font-size="9">Pi 5</text>

  <!-- NODES -->
  <g font-family="ui-monospace, Consolas, monospace" font-size="11">
    <g transform="translate(70,250)">
      <rect width="120" height="44" rx="8" fill="#151520" stroke="#00f0ff"/>
      <text x="60" y="20" text-anchor="middle" fill="#e0e0f0">alaska</text>
      <text x="60" y="34" text-anchor="middle" fill="#a0a0b0" font-size="9">agent</text>
    </g>
    <g transform="translate(230,300)">
      <rect width="120" height="44" rx="8" fill="#151520" stroke="#00f0ff"/>
      <text x="60" y="20" text-anchor="middle" fill="#e0e0f0">biloxi</text>
      <text x="60" y="34" text-anchor="middle" fill="#a0a0b0" font-size="9">agent</text>
    </g>
    <g transform="translate(420,320)">
      <rect width="120" height="44" rx="8" fill="#151520" stroke="#00f0ff"/>
      <text x="60" y="20" text-anchor="middle" fill="#e0e0f0">gulfshores</text>
      <text x="60" y="34" text-anchor="middle" fill="#a0a0b0" font-size="9">agent</text>
    </g>
    <g transform="translate(610,300)">
      <rect width="120" height="44" rx="8" fill="#151520" stroke="#00f0ff"/>
      <text x="60" y="20" text-anchor="middle" fill="#e0e0f0">mexico</text>
      <text x="60" y="34" text-anchor="middle" fill="#a0a0b0" font-size="9">agent</text>
    </g>
    <g transform="translate(770,250)">
      <rect width="120" height="44" rx="8" fill="#151520" stroke="#00f0ff"/>
      <text x="60" y="20" text-anchor="middle" fill="#e0e0f0">neworleans</text>
      <text x="60" y="34" text-anchor="middle" fill="#a0a0b0" font-size="9">agent</text>
    </g>
  </g>

  <!-- radio paths + packets -->
  <path id="p1" d="M130,250 Q240,200 480,203" fill="none" stroke="#00f0ff" stroke-opacity=".25"/>
  <path id="p2" d="M290,300 Q360,230 480,203" fill="none" stroke="#00f0ff" stroke-opacity=".25"/>
  <path id="p3" d="M480,320 Q480,270 480,219" fill="none" stroke="#00f0ff" stroke-opacity=".25"/>
  <path id="p4" d="M670,300 Q600,230 480,203" fill="none" stroke="#00f0ff" stroke-opacity=".25"/>
  <path id="p5" d="M830,250 Q720,200 480,203" fill="none" stroke="#00f0ff" stroke-opacity=".25"/>

  <circle r="5" fill="#00f0ff"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
  <circle r="5" fill="#00f0ff"><animateMotion dur="2.1s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
  <circle r="5" fill="#ffd700"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
  <circle r="5" fill="#00f0ff"><animateMotion dur="2.0s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
  <circle r="5" fill="#00f0ff"><animateMotion dur="1.9s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion></circle>

  <text x="480" y="118" text-anchor="middle" fill="#a0a0b0" font-family="ui-monospace, Consolas, monospace" font-size="11">heartbeat every 20–30s · SENTINEL_KEY must match</text>

  <!-- bottom rail: lock / asr / pts -->
  <g font-family="ui-monospace, Consolas, monospace">
    <rect x="24" y="390" width="292" height="128" rx="10" fill="#12121a" stroke="#2a2a3a"/>
    <text x="40" y="414" fill="#00f0ff" font-size="11">1  KEY GATE</text>
    <text x="40" y="436" fill="#e0e0f0" font-size="13">Fail closed</text>
    <text x="40" y="456" fill="#a0a0b0" font-size="11">right key → enter</text>
    <text x="40" y="472" fill="#ff0040" font-size="11">wrong / empty → 401</text>
    <text x="40" y="498" fill="#606070" font-size="10">PULSAR_SERVICE_KEY</text>
    <circle cx="270" cy="454" r="7" fill="#00ff41">
      <animate attributeName="fill" values="#00ff41;#ff0040;#00ff41" dur="3s" repeatCount="indefinite"/>
    </circle>

    <rect x="334" y="390" width="292" height="128" rx="10" fill="#12121a" stroke="#2a2a3a"/>
    <text x="350" y="414" fill="#ff00ff" font-size="11">2  HYBRID LOCK + ASR</text>
    <text x="350" y="436" fill="#e0e0f0" font-size="13">ML-KEM wraps AES-256-GCM</text>
    <text x="350" y="456" fill="#a0a0b0" font-size="11">event → ASR → batch 50</text>
    <text x="350" y="472" fill="#a0a0b0" font-size="11">Merkle tree → chain logger</text>
    <text x="350" y="498" fill="#606070" font-size="10">90-day rotate · 7-day grace</text>
    <rect x="556" y="448" width="46" height="28" rx="4" fill="#101018" stroke="#ffd700">
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <text x="579" y="466" text-anchor="middle" fill="#ffd700" font-size="9">M</text>

    <rect x="644" y="390" width="292" height="128" rx="10" fill="#12121a" stroke="#2a2a3a"/>
    <text x="660" y="414" fill="#ffd700" font-size="11">3  PTS GAUGE</text>
    <text x="660" y="436" fill="#e0e0f0" font-size="13">four weights, live score</text>
    <rect x="660" y="452" width="256" height="14" rx="7" fill="#1a1a25"/>
    <rect x="660" y="452" width="70" height="14" rx="7" fill="#00ff41"/>
    <rect x="730" y="452" width="110" height="14" fill="#ffd700"/>
    <rect x="840" y="452" width="76" height="14" rx="7" fill="#ff0040"/>
    <circle r="6" fill="#ffffff" cy="459">
      <animate attributeName="cx" values="674;906;674" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="660" y="486" fill="#00ff41" font-size="10">SAFE &lt;50</text>
    <text x="748" y="486" fill="#ffd700" font-size="10">CAUTION</text>
    <text x="848" y="486" fill="#ff0040" font-size="10">CRIT ≥150</text>
    <text x="660" y="508" fill="#606070" font-size="10">0.4q + 0.3a + 0.2r + 0.1s</text>
  </g>
</svg>
